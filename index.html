<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Weather Quest Cube | Top Goal Unit 8 Adventure</title>
    <!-- Google Fonts & Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Three.js Core & OrbitControls -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            background: linear-gradient(145deg, #90d2ff 0%, #c0e4ff 100%);
            position: relative;
        }

        /* Animated Clouds & Floating Weather Icons */
        .cloud {
            position: fixed;
            background: rgba(255,255,255,0.9);
            border-radius: 1000px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            z-index: 1;
            pointer-events: none;
        }
        .cloud::before, .cloud::after {
            content: '';
            position: absolute;
            background: inherit;
            border-radius: 50%;
        }
        .cloud::before { width: 50px; height: 50px; top: -25px; left: 15px; }
        .cloud::after { width: 70px; height: 70px; top: -35px; left: 45px; }
        .cloud1 { width: 110px; height: 60px; top: 15%; left: -10%; animation: drift 35s linear infinite; }
        .cloud2 { width: 140px; height: 70px; top: 45%; right: -5%; animation: drift 45s linear infinite reverse; }
        .cloud3 { width: 90px; height: 50px; bottom: 20%; left: 5%; animation: drift 25s linear infinite; }

        @keyframes drift {
            from { transform: translateX(0); }
            to { transform: translateX(120vw); }
        }

        .floating-icon {
            position: fixed;
            font-size: 1.8rem;
            opacity: 0.3;
            pointer-events: none;
            animation: float 12s infinite ease-in-out;
            z-index: 1;
        }
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-25px) rotate(5deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        /* Main layout */
        .game-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
            min-height: 100vh;
        }

        /* Saudi Characters */
        .characters {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .character {
            background: #ffefcf;
            border-radius: 100px;
            padding: 0.4rem 1rem 0.4rem 0.6rem;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 6px 0 #c29b4a;
            transition: transform 0.2s;
        }
        .character img {
            width: 48px;
            height: 48px;
            background: #f9d9a5;
            border-radius: 50%;
            object-fit: cover;
        }
        .character span {
            font-weight: bold;
            font-size: 1rem;
            color: #3a2800;
        }

        /* 3D Cube Area */
        .cube-stage {
            width: 320px;
            height: 320px;
            margin: 20px auto;
            position: relative;
            cursor: grab;
        }
        canvas {
            width: 100% !important;
            height: 100% !important;
            border-radius: 32px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.3);
        }

        .roll-btn {
            background: #ff9f4a;
            border: none;
            font-size: 1.8rem;
            font-weight: bold;
            font-family: inherit;
            padding: 12px 28px;
            border-radius: 60px;
            color: white;
            text-shadow: 2px 2px 0 #b45f1b;
            box-shadow: 0 8px 0 #b45f1b;
            transition: 0.07s linear;
            cursor: pointer;
            margin: 16px 0;
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }
        .roll-btn:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #b45f1b;
        }

        /* Activity Panel */
        .activity-panel {
            background: rgba(255, 248, 225, 0.95);
            backdrop-filter: blur(5px);
            border-radius: 48px;
            width: 90%;
            max-width: 750px;
            margin: 15px auto 30px;
            padding: 25px 20px;
            box-shadow: 0 20px 30px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            border: 3px solid white;
        }

        .activity-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 2px dashed #ffbc6e;
            padding-bottom: 12px;
            margin-bottom: 20px;
        }
        .badge-area {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .xp-bar {
            background: #e9d5b5;
            border-radius: 20px;
            height: 16px;
            width: 150px;
            overflow: hidden;
        }
        .xp-fill {
            width: 0%;
            height: 100%;
            background: #5fc936;
            transition: width 0.3s;
        }
        .badge-icon {
            font-size: 1.8rem;
            cursor: help;
        }

        /* Interactive Activity Content */
        .activity-content {
            min-height: 280px;
        }
        .choice-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin: 20px 0;
        }
        .option-card {
            background: white;
            border-radius: 30px;
            padding: 12px 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.1s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border: 2px solid transparent;
        }
        .option-card:hover { transform: scale(1.02); background: #ffefcf; }
        .correct-feedback { color: #2b8c1e; font-weight: bold; margin: 10px; }
        .wrong-feedback { color: #d9534f; font-weight: bold; }

        /* Wheel spinner */
        .wheel-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas.wheel-canvas {
            width: 200px;
            height: 200px;
            background: white;
            border-radius: 50%;
        }

        button {
            background: #fed287;
            border: none;
            padding: 8px 16px;
            border-radius: 40px;
            font-weight: bold;
            font-family: inherit;
            margin: 5px;
            cursor: pointer;
        }

        @media (max-width: 650px) {
            .cube-stage { width: 250px; height: 250px; }
            .roll-btn { font-size: 1.4rem; padding: 8px 20px; }
        }
        .speak-btn {
            background: #6cc9f0;
            color: white;
            border-radius: 100%;
            width: 36px;
            height: 36px;
        }
    </style>
</head>
<body>
<div class="cloud cloud1"></div>
<div class="cloud cloud2"></div>
<div class="cloud cloud3"></div>
<div class="floating-icon" style="top: 12%; left: 8%;"><i class="fas fa-sun"></i></div>
<div class="floating-icon" style="top: 70%; left: 85%;"><i class="fas fa-cloud-rain"></i></div>
<div class="floating-icon" style="top: 40%; left: 15%;"><i class="fas fa-snowflake"></i></div>
<div class="floating-icon" style="top: 80%; left: 30%;"><i class="fas fa-wind"></i></div>

<div class="game-container">
    <div class="characters">
        <div class="character" id="character1">
            <div style="background:#EFD2A8; border-radius:50%; width:48px;height:48px; display: flex; align-items:center; justify-content:center;"><i class="fas fa-child" style="font-size: 32px; color:#8b5a2b;"></i></div>
            <span>Ahmed 🇸🇦</span>
        </div>
        <div class="character" id="character2">
            <div style="background:#EFD2A8; border-radius:50%; width:48px;height:48px; display: flex; align-items:center; justify-content:center;"><i class="fas fa-user-graduate" style="font-size: 32px; color:#8b5a2b;"></i></div>
            <span>Layla ✨</span>
        </div>
    </div>

    <div class="cube-stage" id="cubeContainer"></div>
    <button class="roll-btn" id="rollCubeBtn"><i class="fas fa-dice-d6"></i> ROLL THE CUBE! <i class="fas fa-cloud-sun"></i></button>

    <div class="activity-panel" id="activityPanel">
        <div class="activity-header">
            <h2><i class="fas fa-magic"></i> <span id="activityTitle">Weather Challenge</span></h2>
            <div class="badge-area">
                <div class="xp-bar"><div class="xp-fill" id="xpFill"></div></div>
                <span id="xpPoints">0 XP</span>
                <div class="badge-icon" id="badgeIcon" title="Earn stickers!"><i class="fas fa-star-of-life"></i>⭐</div>
            </div>
        </div>
        <div id="activityContent" class="activity-content">✨ Roll the cube to start learning! ✨</div>
        <div id="feedbackMsg" style="margin-top: 12px; font-weight: bold; text-align: center;"></div>
    </div>
    <div style="display: flex; gap: 12px; justify-content: center; margin-bottom: 15px;">
        <button id="dayNightToggle"><i class="fas fa-moon"></i> Night mode</button>
        <button id="musicToggle"><i class="fas fa-volume-up"></i> Sound FX</button>
    </div>
</div>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ---------- setup 3D cube ----------
    const container = document.getElementById('cubeContainer');
    const scene = new THREE.Scene();
    scene.background = null; // transparent
    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
    camera.position.set(2, 1.8, 3);
    camera.lookAt(0,0,0);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.autoRotate = false;
    controls.enableZoom = true;
    controls.enablePan = false;
    controls.rotateSpeed = 2;

    // lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1);
    dirLight.position.set(2, 5, 3);
    scene.add(dirLight);
    const backLight = new THREE.PointLight(0xffaa66, 0.4);
    backLight.position.set(-1, 1, -2);
    scene.add(backLight);

    // texture generator for weather icons
    function makeIconTexture(iconType, color) {
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff9ef';
        ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle = color;
        ctx.font = `Bold ${canvas.width * 0.4}px "Font Awesome 6 Free", "Segoe UI Emoji"`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        let symbol = '';
        switch(iconType){
            case 'sun': symbol = '☀️'; ctx.fillStyle = '#FFD966'; break;
            case 'cloud': symbol = '☁️'; ctx.fillStyle = '#B0C4DE'; break;
            case 'rain': symbol = '🌧️'; ctx.fillStyle = '#5DADE2'; break;
            case 'snow': symbol = '❄️'; ctx.fillStyle = '#AED6F1'; break;
            case 'rainbow': symbol = '🌈'; ctx.fillStyle = '#FFB347'; break;
            case 'wind': symbol = '💨'; ctx.fillStyle = '#AAB7B8'; break;
        }
        ctx.fillText(symbol, canvas.width/2, canvas.height/2);
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 8;
        ctx.strokeRect(10,10,canvas.width-20,canvas.height-20);
        const texture = new THREE.CanvasTexture(canvas);
        texture.needsUpdate = true;
        return texture;
    }

    const materials = [
        new THREE.MeshStandardMaterial({ map: makeIconTexture('sun', '#FFD966'), roughness: 0.2, metalness: 0.7 }),  // front
        new THREE.MeshStandardMaterial({ map: makeIconTexture('cloud', '#B0C4DE'), roughness: 0.2, metalness: 0.7 }),
        new THREE.MeshStandardMaterial({ map: makeIconTexture('rain', '#5DADE2'), roughness: 0.2, metalness: 0.7 }),
        new THREE.MeshStandardMaterial({ map: makeIconTexture('snow', '#AED6F1'), roughness: 0.2, metalness: 0.7 }),
        new THREE.MeshStandardMaterial({ map: makeIconTexture('rainbow', '#FFB347'), roughness: 0.2, metalness: 0.7 }),
        new THREE.MeshStandardMaterial({ map: makeIconTexture('wind', '#AAB7B8'), roughness: 0.2, metalness: 0.7 })
    ];
    const geometry = new THREE.BoxGeometry(1.2, 1.2, 1.2);
    const cube = new THREE.Mesh(geometry, materials);
    scene.add(cube);

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }
    animate();
    window.addEventListener('resize', () => {
        const w = container.clientWidth, h = container.clientHeight;
        camera.aspect = w/h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
    });

    // ----- game state -----
    let currentActivity = null;
    let xp = 0;
    let soundEnabled = true;
    let dayMode = true;
    const xpFill = document.getElementById('xpFill');
    const xpPointsSpan = document.getElementById('xpPoints');
    const badgeIconDiv = document.getElementById('badgeIcon');
    let stickersUnlocked = 0;

    function playSound(type) {
        if(!soundEnabled) return;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sine';
        let freq = type === 'correct' ? 880 : 440;
        osc.frequency.value = freq;
        gain.gain.value = 0.2;
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.5);
        osc.stop(audioCtx.currentTime + 0.3);
    }

    function addXP(amount) {
        xp += amount;
        xpPointsSpan.innerText = xp + " XP";
        let percent = Math.min(100, (xp % 200) / 2);
        xpFill.style.width = percent + "%";
        if(Math.floor(xp/200) > stickersUnlocked) {
            stickersUnlocked++;
            badgeIconDiv.innerHTML = `<i class="fas fa-award"></i>🌟 x${stickersUnlocked}`;
            document.getElementById('feedbackMsg').innerHTML = "🎉 NEW BADGE UNLOCKED! 🎉";
            setTimeout(()=>{ if(currentActivity) showFeedback(''); }, 1500);
        }
        if(amount>0) playSound('correct');
    }

    function showFeedback(msg, isError=false) {
        const fbDiv = document.getElementById('feedbackMsg');
        fbDiv.innerHTML = isError ? `❌ ${msg}` : `✅ ${msg}`;
        fbDiv.style.color = isError ? '#c0392b' : '#2c7a1f';
        setTimeout(() => {
            if(document.getElementById('feedbackMsg').innerHTML === fbDiv.innerHTML) fbDiv.innerHTML = '';
        }, 2000);
    }

    function speakWord(word) {
        if(!window.speechSynthesis) return;
        const utterance = new SpeechSynthesisUtterance(word);
        utterance.lang = 'en-US';
        utterance.rate = 0.9;
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(utterance);
    }

    function confettiEffect() {
        import('https://cdn.skypack.dev/canvas-confetti').then(module => {
            module.default({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#ffd966', '#5dade2', '#f1948a'] });
        }).catch(()=>{});
    }

    // Activities Definitions
    const activities = [
        { name: '🌞 Vocabulary Challenge', load: (containerDiv) => vocabChallenge(containerDiv) },
        { name: '📚 Grammar - "be going to"', load: (containerDiv) => grammarChallenge(containerDiv) },
        { name: '🎡 Weather Wheel Spinner', load: (containerDiv) => weatherWheel(containerDiv) },
        { name: '🎮 Mini Weather Game', load: (containerDiv) => miniGame(containerDiv) },
        { name: '📖 Story Adventure', load: (containerDiv) => storyAdventure(containerDiv) },
        { name: '❓ Mystery Question', load: (containerDiv) => mysterySide(containerDiv) }
    ];

    function rollRandomActivity() {
        const randomIndex = Math.floor(Math.random() * activities.length);
        currentActivity = randomIndex;
        document.getElementById('activityTitle').innerHTML = activities[randomIndex].name;
        const contentDiv = document.getElementById('activityContent');
        contentDiv.innerHTML = '<div style="text-align:center;">🌀 Loading game...</div>';
        activities[randomIndex].load(contentDiv);
        // Animate cube roll (rotation shuffle)
        const randomRot = { x: Math.random() * Math.PI * 2, y: Math.random() * Math.PI * 2, z: Math.random() * Math.PI * 0.5 };
        cube.rotation.x = randomRot.x;
        cube.rotation.y = randomRot.y;
        cube.rotation.z = randomRot.z;
        playSound('correct'); // roll sound effect
    }

    // Vocabulary challenge using lesson words
    function vocabChallenge(div) {
        const vocab = ['sunny', 'rainy', 'cloudy', 'windy', 'snow', 'rainbow', 'hot', 'cold', 'season', 'weather', 'warm', 'cool'];
        const randomWord = vocab[Math.floor(Math.random() * vocab.length)];
        const definitions = { sunny: '☀️ bright sun', rainy: '🌧️ water drops', cloudy: '☁️ grey sky', windy: '💨 strong air', snow: '❄️ white flakes', rainbow: '🌈 colorful arc', hot: '🔥 high temperature', cold: '🧊 low temperature', season: '🍂 spring, summer...', weather: '⛅ outside condition', warm: '🌡️ pleasant heat', cool: '🍃 fresh air' };
        div.innerHTML = `
            <h3>🔊 Vocabulary: <u>${randomWord}</u> <button class="speak-btn" id="speakVocab"><i class="fas fa-volume-up"></i></button></h3>
            <p>Match the picture!</p>
            <div class="choice-grid" id="vocabChoices"></div>
        `;
        const choices = ['sunny', 'rainy', 'windy', 'snow'].sort(() => 0.5 - Math.random());
        const grid = div.querySelector('#vocabChoices');
        choices.forEach(opt => {
            const btn = document.createElement('div');
            btn.className = 'option-card';
            btn.innerHTML = `${opt} ${opt==='sunny'?'☀️':opt==='rainy'?'🌧️':opt==='windy'?'💨':'❄️'}`;
            btn.onclick = () => {
                if(opt === randomWord) {
                    showFeedback(`Great! ${randomWord} is correct! +15 XP`);
                    addXP(15);
                    confettiEffect();
                    vocabChallenge(div);
                } else {
                    showFeedback(`Not quite! Try again.`, true);
                    playSound('wrong');
                }
            };
            grid.appendChild(btn);
        });
        document.getElementById('speakVocab')?.addEventListener('click',()=>speakWord(randomWord));
    }

    function grammarChallenge(div) {
        const qa = [
            { q: "It _____ going to rain tomorrow.", correct: "is", options: ["am","is","are"] },
            { q: "They _____ going to play football.", correct: "are", options: ["is","am","are"] },
            { q: "What _____ the weather going to be like?", correct: "is", options: ["is","are","am"] },
            { q: "I _____ going to wear a jacket.", correct: "am", options: ["am","is","are"] }
        ];
        const item = qa[Math.floor(Math.random()*qa.length)];
        div.innerHTML = `<h3>✏️ Complete the sentence:</h3><p style="font-size:1.4rem;">${item.q}</p><div class="choice-grid" id="grammarOptions"></div>`;
        const optDiv = div.querySelector('#grammarOptions');
        item.options.forEach(opt => {
            const btn = document.createElement('div');
            btn.className = 'option-card';
            btn.innerText = opt;
            btn.onclick = () => {
                if(opt === item.correct) {
                    showFeedback(`Excellent! "be going to" correct! +15 XP`);
                    addXP(15);
                    confettiEffect();
                    grammarChallenge(div);
                } else { showFeedback(`Try again! Use "${item.correct}".`, true); playSound('wrong'); }
            };
            optDiv.appendChild(btn);
        });
    }

    function weatherWheel(div) {
        const sectors = ['Sunny', 'Rainy', 'Snowy', 'Windy', 'Cloudy', 'Hot'];
        let spinning = false;
        div.innerHTML = `<div class="wheel-container"><canvas id="wheelCanvas" width="250" height="250" class="wheel-canvas"></canvas><button id="spinWheel">🎡 SPIN!</button><p id="wheelResult"></p></div>`;
        const canvas = div.querySelector('#wheelCanvas');
        const ctx = canvas.getContext('2d');
        function drawWheel() {
            const angleStep = (Math.PI * 2)/sectors.length;
            for(let i=0;i<sectors.length;i++){
                ctx.beginPath();
                ctx.fillStyle = `hsl(${i*60}, 70%, 60%)`;
                ctx.moveTo(125,125);
                ctx.arc(125,125,125, i*angleStep, (i+1)*angleStep);
                ctx.fill();
                ctx.save();
                ctx.translate(125,125);
                ctx.rotate(i*angleStep + angleStep/2);
                ctx.fillStyle = 'white';
                ctx.font = 'bold 16px "Quicksand"';
                ctx.fillText(sectors[i], 50, 10);
                ctx.restore();
            }
        }
        drawWheel();
        document.getElementById('spinWheel').onclick = () => {
            if(spinning) return;
            spinning = true;
            let spins = Math.floor(Math.random() * 20) + 10;
            let current = 0;
            const interval = setInterval(()=>{
                current++;
                if(current >= spins) {
                    clearInterval(interval);
                    const finalIndex = Math.floor(Math.random() * sectors.length);
                    const weather = sectors[finalIndex];
                    document.getElementById('wheelResult').innerHTML = `🎉 It's ${weather}! 🎉<br> Say: "It's ${weather}. I'm going to ${weather==='Snowy'?'make a snowman':weather==='Sunny'?'wear sunglasses':weather==='Rainy'?'take an umbrella':'enjoy the day'}." <button id="confirmWheel">Got it ✓</button>`;
                    document.getElementById('confirmWheel')?.addEventListener('click',()=>{ addXP(10); confettiEffect(); showFeedback("Great future prediction!"); weatherWheel(div); });
                    spinning = false;
                } else {
                    const fake = Math.floor(Math.random() * sectors.length);
                    ctx.clearRect(0,0,250,250);
                    drawWheel();
                }
            }, 50);
        };
    }

    function miniGame(div) {
        const scenarios = [{ weather: "rainy", item: "umbrella", emoji: "☔"},{ weather: "sunny", item: "sunglasses", emoji: "🕶️"},{ weather: "snowy", item: "jacket", emoji: "🧥"}];
        const s = scenarios[Math.floor(Math.random()*scenarios.length)];
        div.innerHTML = `<h3>🌦️ Dress for the weather!</h3><p>It's <strong>${s.weather}</strong>. What do you need?</p><div class="choice-grid" id="gameOptions"></div>`;
        const opts = [s.item, "flipflops", "book"];
        const grid = div.querySelector('#gameOptions');
        opts.forEach(opt => {
            const btn = document.createElement('div');
            btn.className = 'option-card';
            btn.innerHTML = opt === s.item ? `${s.emoji} ${opt}` : opt;
            btn.onclick = () => {
                if(opt === s.item) { addXP(15); showFeedback(`Perfect! ${opt} is right!`); confettiEffect(); miniGame(div); }
                else { showFeedback(`Oops! Not for ${s.weather}.`, true); playSound('wrong');}
            };
            grid.appendChild(btn);
        });
    }

    function storyAdventure(div) {
        div.innerHTML = `<h3>🌍 The Weather Dome - Zack, Layla & Mateo</h3><p>In the Weather Dome, it suddenly became rainy! Help Zack pick the right item.</p><div class="choice-grid" id="storyChoices"></div>`;
        const items = [{name:"Umbrella", correct:true},{name:"Sandwich", correct:false},{name:"Flashlight", correct:false}];
        const grid = div.querySelector('#storyChoices');
        items.forEach(it=>{
            const btn = document.createElement('div');
            btn.className = 'option-card';
            btn.innerText = it.name;
            btn.onclick = () => {
                if(it.correct) { addXP(20); showFeedback("Zack stays dry! You solved the weather problem!"); confettiEffect(); storyAdventure(div); }
                else { showFeedback("Not helpful in the rain! Try again.", true); playSound('wrong');}
            };
            grid.appendChild(btn);
        });
    }

    function mysterySide(div) {
        const questions = ["What's the weather like today in your city?", "Was it cloudy yesterday?", "What season do you like? Why?", "What happens in Alaska because of global warming?"];
        const q = questions[Math.floor(Math.random()*questions.length)];
        div.innerHTML = `<h3>🗣️ Mystery Question</h3><p style="font-size:1.2rem;">${q}</p><textarea id="answerMystery" rows="2" style="width:80%; border-radius:30px; padding:10px;" placeholder="Type your answer..."></textarea><br><button id="submitMystery">Submit & Earn XP</button>`;
        document.getElementById('submitMystery')?.addEventListener('click',()=>{
            const ans = document.getElementById('answerMystery').value.trim();
            if(ans.length>2) { addXP(10); showFeedback("Great thinking! +10 XP!"); confettiEffect(); mysterySide(div);}
            else showFeedback("Write a short answer!", true);
        });
    }

    document.getElementById('rollCubeBtn').addEventListener('click', rollRandomActivity);
    document.getElementById('dayNightToggle').addEventListener('click',()=>{
        dayMode = !dayMode;
        document.body.style.background = dayMode ? 'linear-gradient(145deg, #90d2ff 0%, #c0e4ff 100%)' : 'linear-gradient(145deg, #1e2a3a 0%, #0b1a28 100%)';
        document.getElementById('dayNightToggle').innerHTML = dayMode ? '<i class="fas fa-moon"></i> Night mode' : '<i class="fas fa-sun"></i> Day mode';
    });
    document.getElementById('musicToggle').addEventListener('click',()=>{
        soundEnabled = !soundEnabled;
        document.getElementById('musicToggle').innerHTML = soundEnabled ? '<i class="fas fa-volume-up"></i> Sound FX' : '<i class="fas fa-volume-mute"></i> Mute';
    });
    rollRandomActivity(); // first load
    // Add celebratory characters happy on correct answers (via feedback above)
    setInterval(()=>{
        const c1 = document.getElementById('character1');
        if(c1) c1.style.transform = 'scale(1.02)';
        setTimeout(()=>{if(c1) c1.style.transform='scale(1)';},300);
    }, 5000);
</script>
</body>
</html>
